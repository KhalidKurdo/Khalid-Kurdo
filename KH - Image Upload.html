<!-- ============================================================
     ویجێتی بارکردنی وێنە بۆ بلۆگەری Blogger — بارکردن لەسەر ImgBB
     ============================================================
     دامەزراندن:
     1. بەخۆڕایی خۆت تۆمار بکە (بێ کارتی بانکی، تەنها یەک خولەک) لە:
        https://api.imgbb.com/  ← کرتە لە "Get API Key" بکە
     2. کلیلەکە کۆپی بکە و لە جیاتی API_KEY لە خوارەوە دایبنێ.
     3. لە پانێڵی بەڕێوەبردنی Blogger: Layout > Add a Gadget > HTML/JavaScript.
     4. هەموو کۆدەکە بلکێنە و پاشەکەوتی بکە.
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<style>
.uw-widget, .uw-widget *{ box-sizing:border-box; }
.uw-widget{
  --bg:#15161b;
  --card:#1d1f26;
  --card-2:#242730;
  --amber:#e7a94c;
  --amber-dim:#8a6a35;
  --ink:#f2efe8;
  --muted:#9497a3;
  --line:#31333d;
  --ok:#5cc990;

  width:100%;
  max-width:460px;
  margin:28px auto;
  background:var(--bg);
  border-radius:18px;
  padding:2px;
  background-image:linear-gradient(150deg, var(--amber-dim), var(--bg) 35%);
  font-family:'Cairo',Tahoma,Arial,sans-serif;
  direction:rtl;
}
.uw-inner{
  background:var(--card);
  border-radius:16px;
  padding:26px 22px;
}
.uw-eyebrow{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.12em;
  color:var(--amber);
  text-transform:uppercase;
  margin-bottom:6px;
  direction:ltr;
  justify-content:flex-end;
}
.uw-eyebrow .uw-dot{
  width:6px; height:6px; border-radius:50%;
  background:var(--amber);
  box-shadow:0 0 8px var(--amber);
}
.uw-widget h3{
  margin:0 0 18px;
  font-size:20px;
  font-weight:800;
  color:var(--ink);
  text-align:right;
}

.uw-drop{
  position:relative;
  display:block;
  min-height:44px;
  border:1.5px dashed var(--line);
  border-radius:14px;
  padding:30px 16px;
  text-align:center;
  cursor:pointer;
  background:var(--card-2);
  transition:border-color .25s, background .25s, transform .15s;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.uw-drop:hover{ border-color:var(--amber-dim); }
.uw-drop.uw-drag{
  border-color:var(--amber);
  background:#2a2416;
  transform:scale(1.01);
}
.uw-drop input{ display:none; }
.uw-drop-icon{
  width:38px; height:38px;
  margin:0 auto 10px;
  color:var(--amber);
  opacity:.9;
}
.uw-drop p{ margin:0; font-size:13.5px; color:var(--muted); }
.uw-drop p b{ color:var(--ink); font-weight:700; }

.uw-preview{
  margin-top:16px;
  display:none;
  position:relative;
  border-radius:12px;
  overflow:hidden;
  border:1px solid var(--line);
}
.uw-preview img{
  width:100%;
  max-height:230px;
  object-fit:cover;
  display:block;
}
.uw-bar-wrap{
  position:absolute; bottom:0; left:0; right:0;
  height:3px; background:rgba(0,0,0,.4);
}
.uw-bar{
  height:100%; width:0%;
  background:var(--amber);
  transition:width .25s ease;
}

.uw-status{
  margin-top:12px;
  font-size:12.5px;
  color:var(--muted);
  font-family:'IBM Plex Mono',monospace;
  direction:ltr;
  text-align:right;
  min-height:16px;
}
.uw-status.uw-ok{ color:var(--ok); }
.uw-status.uw-err{ color:#e06a6a; }

.uw-result{
  display:none;
  margin-top:16px;
  background:var(--card-2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
}
.uw-link-row{ display:flex; gap:8px; align-items:center; }
.uw-link-row input{
  flex:1;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:9px;
  font-size:12.5px;
  font-family:'IBM Plex Mono',monospace;
  direction:ltr;
  text-align:left;
  background:var(--bg);
  color:var(--ink);
}
.uw-copy-btn{
  border:none;
  border-radius:9px;
  padding:10px 16px;
  min-height:44px;
  font-size:13px;
  font-weight:700;
  font-family:'Cairo',sans-serif;
  cursor:pointer;
  background:var(--amber);
  color:#20180a;
  white-space:nowrap;
  transition:filter .15s, transform .12s;
  -webkit-tap-highlight-color:transparent;
}
.uw-copy-btn:hover{ filter:brightness(1.08); transform:translateY(-1px); }
.uw-copy-btn:active{ transform:translateY(0); }
.uw-copy-btn.uw-copied{ background:var(--ok); color:#0c2417; }

.uw-share-label{
  font-size:11px;
  color:var(--muted);
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:.05em;
  margin:16px 0 9px;
}
.uw-share-row{ display:flex; flex-wrap:wrap; gap:8px; }
.uw-share-btn{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px;
  flex:1 1 18%;
  min-width:56px;
  min-height:44px;
  padding:11px 4px;
  border-radius:11px;
  font-size:10.5px;
  font-weight:700;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--ink);
  text-decoration:none;
  cursor:pointer;
  transition:transform .12s ease, border-color .12s ease, background .12s ease;
  -webkit-tap-highlight-color:transparent;
}
.uw-share-btn svg{ width:18px; height:18px; }
.uw-share-btn:hover{
  transform:translateY(-2px);
  border-color:var(--amber);
  background:var(--card-2);
}
.uw-share-btn:active{ transform:translateY(0); }

/* ===== الاستجابة لمختلف أحجام الشاشات ===== */
@media (max-width:600px){
  .uw-widget{ margin:18px auto; border-radius:16px; }
  .uw-inner{ padding:20px 16px; }
  .uw-widget h3{ font-size:18px; margin-bottom:14px; }
  .uw-drop{ padding:24px 12px; }
  .uw-drop-icon{ width:32px; height:32px; }
  .uw-drop p{ font-size:13px; }
}
@media (max-width:380px){
  .uw-inner{ padding:16px 12px; }
  .uw-eyebrow{ font-size:10px; }
  .uw-widget h3{ font-size:16.5px; }
  .uw-drop{ padding:20px 10px; }
  .uw-link-row{ flex-wrap:wrap; }
  .uw-link-row input{ flex-basis:100%; }
  .uw-copy-btn{ flex:1; }
  .uw-share-btn{ flex-basis:30%; font-size:9.5px; }
}
/* يمنع تكبير سفاري تلقائيًا عند التركيز على الحقل في الجوال */
@media (max-width:600px){
  .uw-link-row input{ font-size:16px; }
}
/* الأجهزة اللوحية والشاشات الكبيرة: مساحة مريحة أكثر */
@media (min-width:900px){
  .uw-widget{ max-width:500px; }
}
/* تفضيل تقليل الحركة */
@media (prefers-reduced-motion:reduce){
  .uw-drop, .uw-share-btn, .uw-copy-btn, .uw-bar{ transition:none; }
}
</style>

<div class="uw-widget">
  <div class="uw-inner">
    <div class="uw-eyebrow"><span class="uw-dot"></span>IMAGE&nbsp;LINK</div>
    <h3>وێنەیەک باربکە و لینکەکەی وەربگرە</h3>

    <label class="uw-drop" id="uwDrop">
      <input type="file" id="uwFile" accept="image/*">
      <svg class="uw-drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 16.5V19a2 2 0 002 2h12a2 2 0 002-2v-2.5M7 9l5-5 5 5M12 4v13" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p id="uwDropText"><b>کرتە بکە بۆ هەڵبژاردن</b> یان وێنەکە ڕابکێشە و لێرە دایبنێ</p>
    </label>

    <div class="uw-preview" id="uwPreview">
      <img id="uwImg" alt="پێشبینینی وێنە">
      <div class="uw-bar-wrap"><div class="uw-bar" id="uwBar"></div></div>
    </div>

    <div class="uw-status" id="uwStatus"></div>

    <div class="uw-result" id="uwResult">
      <div class="uw-link-row">
        <input type="text" id="uwLink" readonly>
        <button class="uw-copy-btn" id="uwCopy">کۆپی</button>
      </div>

      <div class="uw-share-label">هاوبەشکردنی خێرا</div>
      <div class="uw-share-row">
        <a class="uw-share-btn" id="uwShareWhatsapp" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39a9.9 9.9 0 004.75 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.02c-.24.68-1.4 1.32-1.93 1.4-.5.08-1.13.11-1.83-.11-.42-.13-.96-.31-1.65-.61-2.9-1.25-4.79-4.17-4.94-4.36-.15-.2-1.18-1.57-1.18-3 0-1.42.75-2.12 1.02-2.41.27-.29.58-.36.78-.36.19 0 .39 0 .56.01.18.01.42-.07.65.5.24.58.83 2 .9 2.15.07.15.12.32.02.52-.09.2-.14.32-.28.49-.14.17-.29.38-.42.51-.14.13-.28.28-.12.55.16.27.71 1.17 1.52 1.89 1.05.93 1.93 1.22 2.2 1.36.27.14.43.11.59-.07.16-.18.68-.79.86-1.06.18-.27.36-.22.6-.13.24.09 1.53.72 1.79.85.26.13.43.2.5.31.06.11.06.65-.18 1.33z"/></svg>
          واتساپ
        </a>
        <a class="uw-share-btn" id="uwShareTelegram" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.94 4.6L18.6 20.1c-.25 1.1-.9 1.38-1.82.86l-5.03-3.71-2.43 2.34c-.27.27-.5.5-1.02.5l.36-5.13 9.34-8.44c.4-.36-.09-.56-.63-.2L6.4 12.5l-4.98-1.56c-1.08-.34-1.1-1.08.23-1.6L20.6 3.13c.9-.32 1.68.22 1.34 1.47z"/></svg>
          تلگرام
        </a>
        <a class="uw-share-btn" id="uwShareTwitter" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.4 8.4L23.3 22h-6.8l-5.3-6.9L5 22H1.9l7.9-9L1 2h7l4.8 6.3L18.9 2zm-1.2 18h1.9L7.4 4H5.4l12.3 16z"/></svg>
          X
        </a>
        <a class="uw-share-btn" id="uwShareFacebook" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-8.1h2.7l.4-3.2h-3.1V7.7c0-.9.25-1.5 1.55-1.5h1.66V3.35C15.9 3.24 14.9 3.15 13.75 3.15c-2.4 0-4.05 1.47-4.05 4.15v2.55H7v3.2h2.7V21h3.8z"/></svg>
          فەیسبووک
        </a>
        <button class="uw-share-btn" id="uwShareNative" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 8a3 3 0 100-6 3 3 0 000 6zM6 15a3 3 0 100-6 3 3 0 000 6zM18 22a3 3 0 100-6 3 3 0 000 6zM8.6 13.5l6.8-3.9M8.6 10.5l6.8 3.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          زیاتر
        </button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // کلیلی تایبەت بە ImgBB خۆت لێرە دابنێ — بەخۆڕایی و لە یەک خولەکدا لە api.imgbb.com وەریبگرە
  var API_KEY = "af2262da027c89bc6b48d0ed5d337c09";
  var API_URL = "https://api.imgbb.com/1/upload";

  var drop      = document.getElementById('uwDrop');
  var fileInput = document.getElementById('uwFile');
  var dropText  = document.getElementById('uwDropText');
  var preview   = document.getElementById('uwPreview');
  var imgEl     = document.getElementById('uwImg');
  var bar       = document.getElementById('uwBar');
  var status    = document.getElementById('uwStatus');
  var resultBox = document.getElementById('uwResult');
  var linkInput = document.getElementById('uwLink');
  var copyBtn   = document.getElementById('uwCopy');

  ['dragover','dragenter'].forEach(function(evt){
    drop.addEventListener(evt, function(e){ e.preventDefault(); drop.classList.add('uw-drag'); });
  });
  ['dragleave','drop'].forEach(function(evt){
    drop.addEventListener(evt, function(e){ e.preventDefault(); drop.classList.remove('uw-drag'); });
  });
  drop.addEventListener('drop', function(e){
    var f = e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
  fileInput.addEventListener('change', function(e){
    var f = e.target.files[0];
    if (f) handleFile(f);
  });

  function setStatus(text, cls){
    status.textContent = text;
    status.className = 'uw-status' + (cls ? ' ' + cls : '');
  }

  function handleFile(file){
    if (!file.type.startsWith('image/')){
      setStatus('تکایە فایلێکی وێنەیی گونجاو هەڵبژێرە.', 'uw-err');
      return;
    }
    dropText.innerHTML = '<b>' + file.name + '</b>';
    var reader = new FileReader();
    reader.onload = function(e){
      imgEl.src = e.target.result;
      preview.style.display = 'block';
      bar.style.width = '0%';
      uploadImage(e.target.result.split(',')[1]);
    };
    reader.readAsDataURL(file);
  }

  function uploadImage(base64Data){
    if (!API_KEY || API_KEY === "YOUR_IMGBB_API_KEY"){
      setStatus('تکایە سەرەتا کلیلی ImgBB API زیاد بکە بۆ کۆدەکە.', 'uw-err');
      return;
    }
    setStatus('بارکردن...');
    resultBox.style.display = 'none';

    var formData = new FormData();
    formData.append('image', base64Data);

    var xhr = new XMLHttpRequest();
    xhr.open('POST', API_URL + '?key=' + API_KEY, true);

    xhr.upload.onprogress = function(e){
      if (e.lengthComputable){
        var pct = Math.round((e.loaded / e.total) * 100);
        bar.style.width = pct + '%';
      }
    };

    xhr.onload = function(){
      try{
        var data = JSON.parse(xhr.responseText);
        if (data.success){
          var url = data.data.url;
          bar.style.width = '100%';
          setStatus('بارکردن سەرکەوتوو بوو', 'uw-ok');
          linkInput.value = url;
          resultBox.style.display = 'block';
          setupShareLinks(url);
        } else {
          setStatus('بارکردن سەرنەکەوت، دووبارە هەوڵ بدەرەوە.', 'uw-err');
        }
      }catch(err){
        setStatus('بارکردن سەرنەکەوت، دووبارە هەوڵ بدەرەوە.', 'uw-err');
      }
    };
    xhr.onerror = function(){
      setStatus('نەتوانرا پەیوەندی بە خزمەتگوزاری بارکردن بکرێت.', 'uw-err');
    };
    xhr.send(formData);
  }

  function setupShareLinks(url){
    var text = encodeURIComponent('سەیری ئەم وێنەیە بکە: ');
    var encodedUrl = encodeURIComponent(url);

    document.getElementById('uwShareWhatsapp').href = 'https://wa.me/?text=' + text + encodedUrl;
    document.getElementById('uwShareTelegram').href = 'https://t.me/share/url?url=' + encodedUrl + '&text=' + text;
    document.getElementById('uwShareTwitter').href = 'https://twitter.com/intent/tweet?text=' + text + '&url=' + encodedUrl;
    document.getElementById('uwShareFacebook').href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodedUrl;

    var nativeBtn = document.getElementById('uwShareNative');
    if (navigator.share){
      nativeBtn.style.display = 'flex';
      nativeBtn.onclick = function(){
        navigator.share({ title: 'وێنە', url: url }).catch(function(){});
      };
    } else {
      nativeBtn.style.display = 'none';
    }
  }

  copyBtn.addEventListener('click', function(){
    linkInput.select();
    linkInput.setSelectionRange(0, 99999);
    try{
      document.execCommand('copy');
      copyBtn.textContent = 'کۆپی کرا ✓';
      copyBtn.classList.add('uw-copied');
      setTimeout(function(){
        copyBtn.textContent = 'کۆپی';
        copyBtn.classList.remove('uw-copied');
      }, 1500);
    }catch(e){
      navigator.clipboard.writeText(linkInput.value);
    }
  });
})();
</script>
