<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube ID Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Noto Kufi Arabic', 'Segoe UI', sans-serif;
  }

  :root {
    --red: #ff0033;
    --red-glow: rgba(255, 0, 51, 0.5);
    --bg: #0a0a0f;
    --card: rgba(20, 20, 30, 0.75);
    --border: rgba(255, 255, 255, 0.08);
    --text: #ffffff;
    --muted: #8b8b9e;
    --green: #00ff88;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 20% 30%, rgba(255, 0, 51, 0.15), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 100, 255, 0.12), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(150, 0, 255, 0.08), transparent 50%);
    animation: bgMove 20s ease-in-out infinite;
    z-index: 0;
    pointer-events: none;
  }

  @keyframes bgMove {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(-5%, -5%) rotate(5deg); }
  }

  .container {
    width: 100%;
    max-width: 780px;
    position: relative;
    z-index: 1;
  }

  .header {
    text-align: center;
    margin-bottom: 35px;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    margin-bottom: 18px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    min-width: 36px;
    background: linear-gradient(135deg, #ff0033, #ff0055);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px var(--red-glow);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 20px var(--red-glow); }
    50% { box-shadow: 0 0 35px var(--red-glow), 0 0 60px var(--red-glow); }
  }

  .logo-icon svg { width: 20px; height: 20px; fill: white; }

  .logo-text {
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(135deg, #fff, #b0b0c0);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: #fff;
  }

  .subtitle {
    color: var(--muted);
    font-size: 13px;
    font-weight: 400;
    margin-top: 2px;
  }

  .input-wrap {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 6px;
    transition: all 0.3s ease;
  }

  .input-wrap:focus-within {
    border-color: var(--red);
    box-shadow: 0 0 0 4px rgba(255, 0, 51, 0.1), 0 0 30px rgba(255, 0, 51, 0.15);
  }

  .input-inner {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .input-icon {
    padding-right: 14px;
    padding-left: 4px;
    color: var(--muted);
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  input[type="text"] {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    padding: 14px 8px;
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    direction: ltr;
    text-align: left;
  }

  input[type="text"]::placeholder {
    color: var(--muted);
    direction: rtl;
    text-align: right;
  }

  .paste-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #ff0033, #cc0029);
    border: none;
    color: white;
    padding: 10px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(255, 0, 51, 0.3);
    flex-shrink: 0;
    white-space: nowrap;
  }

  .paste-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(255, 0, 51, 0.5);
  }

  .paste-btn:active { transform: translateY(0); }

  .paste-btn svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }

  .clear-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 8px;
    display: none;
    transition: color 0.2s;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
  }

  .clear-btn:hover { color: #fff; }
  .clear-btn.visible { display: flex; }

  .error {
    margin-top: 16px;
    padding: 14px 18px;
    background: rgba(255, 0, 51, 0.08);
    border: 1px solid rgba(255, 0, 51, 0.3);
    border-radius: 12px;
    color: #ff5577;
    font-size: 13px;
    display: none;
    align-items: center;
    gap: 10px;
  }

  .error.show {
    display: flex;
    animation: shakeIn 0.4s ease;
  }

  .error svg { flex-shrink: 0; }

  @keyframes shakeIn {
    0% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
    100% { transform: translateX(0); }
  }

  .result {
    margin-top: 24px;
    display: none;
  }

  .result.show {
    display: block;
    animation: fadeUp 0.5s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .field {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 14px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: border-color 0.3s;
  }

  .field:hover { border-color: rgba(255, 255, 255, 0.15); }

  .field.title-field {
    background: linear-gradient(135deg, rgba(255, 0, 51, 0.08), rgba(20, 20, 30, 0.75));
    border-color: rgba(255, 0, 51, 0.25);
  }

  .field-title-value {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    line-height: 1.6;
    direction: rtl;
    text-align: right;
    word-break: break-word;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 46px;
  }

  .field-title-value.loading {
    color: var(--muted);
    font-weight: 400;
    font-size: 13px;
  }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .field-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 10px;
  }

  .field-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .field-label .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px var(--red-glow);
    flex-shrink: 0;
  }

  .field-value {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    padding: 12px 14px;
    word-break: break-all;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: var(--green);
    direction: ltr;
    text-align: left;
    transition: all 0.2s;
    line-height: 1.5;
  }

  .copy-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #fff;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    font-family: inherit;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .copy-btn:hover {
    background: rgba(255, 0, 51, 0.2);
    border-color: var(--red);
  }

  .copy-btn.copied {
    background: rgba(0, 255, 136, 0.15);
    border-color: var(--green);
    color: var(--green);
  }

  .copy-btn svg { width: 12px; height: 12px; fill: currentColor; flex-shrink: 0; }

  .iframe-code-value {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    padding: 12px 14px;
    word-break: break-all;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: #7dd3fc;
    direction: ltr;
    text-align: left;
    transition: all 0.2s;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .thumb-wrap {
    margin-top: 12px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
    background: #000;
    aspect-ratio: 16 / 9;
  }

  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s;
  }

  .thumb-wrap:hover img { transform: scale(1.03); }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(0, 255, 136, 0.15);
    border: 1px solid var(--green);
    color: var(--green);
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 100;
    opacity: 0;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: none;
    max-width: 90%;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .toast svg { flex-shrink: 0; }

  @media (max-width: 500px) {
    body { padding: 20px 14px; }
    .logo { padding: 10px 18px; }
    .logo-text { font-size: 15px; }
    .subtitle { font-size: 11px; }
    .paste-btn { padding: 10px 12px; font-size: 12px; }
    .paste-btn span { display: none; }
    .field-value, .iframe-code-value { font-size: 10px; padding: 10px 12px; }
    .field-title-value { font-size: 13px; }
    .field-label { font-size: 11px; }
    .field { padding: 14px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.5 15.5v-7l6.5 3.5-6.5 3.5z"/></svg>
      </div>
      <div>
        <div class="logo-text">YouTube ID Generator</div>
        <div class="subtitle">لینک دابنێ، ID وەربگرە</div>
      </div>
    </div>
  </div>

  <div class="input-wrap">
    <div class="input-inner">
      <div class="input-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
      </div>
      <input type="text" id="ytLink" placeholder="لینکی یوتیوب لێرە دابنێ..." autocomplete="off" spellcheck="false" />
      <button class="clear-btn" id="clearBtn" title="سڕینەوە" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <button class="paste-btn" id="pasteBtn" type="button">
        <svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0S9.6.84 9.18 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>
        <span>لکاندن</span>
      </button>
    </div>
  </div>

  <div class="error" id="error">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span>لینکەکە دروست نییە، تکایە لینکێکی یوتیوبی ڕاست دابنێ</span>
  </div>

  <div class="result" id="result">

    <!-- ناوی ڤیدیۆ -->
    <div class="field title-field">
      <div class="field-header">
        <div class="field-label"><span class="dot"></span> ناوی ڤیدیۆ</div>
        <button class="copy-btn" data-target="videoTitle" type="button">
          <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          <span>کۆپی</span>
        </button>
      </div>
      <div class="field-title-value loading" id="videoTitle">
        <span class="spinner"></span>
        <span>دەهێنرێت...</span>
      </div>
    </div>

    <!-- ناسنامەی ڤیدیۆ -->
    <div class="field">
      <div class="field-header">
        <div class="field-label"><span class="dot"></span> ناسنامەی ڤیدیۆ</div>
        <button class="copy-btn" data-target="videoId" type="button">
          <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          <span>کۆپی</span>
        </button>
      </div>
      <div class="field-value" id="videoId"></div>
    </div>

    <div class="field">
      <div class="field-header">
        <div class="field-label"><span class="dot"></span> لینکی Embed</div>
        <button class="copy-btn" data-target="embedUrl" type="button">
          <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          <span>کۆپی</span>
        </button>
      </div>
      <div class="field-value" id="embedUrl"></div>
    </div>

    
    <!-- کۆدی iframe -->
    <div class="field">
      <div class="field-header">
        <div class="field-label"><span class="dot"></span> کۆدی iframe</div>
        <button class="copy-btn" data-target="iframeCode" type="button">
          <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          <span>کۆپی</span>
        </button>
      </div>
      <div class="iframe-code-value" id="iframeCode"></div>
    </div>
    
    
    <div class="field">
      <div class="field-header">
        <div class="field-label"><span class="dot"></span> وێنەی ڤیدیۆ (بەرزترین کوالیتی)</div>
        <button class="copy-btn" data-target="thumbUrl" type="button">
          <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          <span>کۆپی</span>
        </button>
      </div>
      <div class="field-value" id="thumbUrl"></div>
      <div class="thumb-wrap">
        <img id="thumbImg" alt="thumbnail" />
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 6 9 17 4 12"/>
  </svg>
  <span id="toastText">کۆپی کرا</span>
</div>

<script>
  (function() {
    'use strict';

    var input = document.getElementById('ytLink');
    var result = document.getElementById('result');
    var error = document.getElementById('error');
    var clearBtn = document.getElementById('clearBtn');
    var pasteBtn = document.getElementById('pasteBtn');
    var toast = document.getElementById('toast');
    var toastText = document.getElementById('toastText');

    var videoTitleEl = document.getElementById('videoTitle');
    var iframeCodeEl = document.getElementById('iframeCode');
    var videoIdEl = document.getElementById('videoId');
    var embedEl = document.getElementById('embedUrl');
    var thumbEl = document.getElementById('thumbUrl');
    var thumbImg = document.getElementById('thumbImg');

    var currentId = null;
    var titleCache = {};
    var fetchController = null;

    function extractVideoId(url) {
      if (!url) return null;
      url = url.trim();
      if (!url) return null;

      if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;

      var patterns = [
        /(?:youtube\.com\/watch\?(?:.*&)?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/|youtube\.com\/shorts\/|youtube\.com\/live\/)([a-zA-Z0-9_-]{11})/,
        /[?&]v=([a-zA-Z0-9_-]{11})/
      ];

      for (var i = 0; i < patterns.length; i++) {
        var match = url.match(patterns[i]);
        if (match && match[1]) return match[1];
      }
      return null;
    }

    function setText(el, text) {
      while (el.firstChild) el.removeChild(el.firstChild);
      el.appendChild(document.createTextNode(text));
    }

    function setTitleLoading() {
      videoTitleEl.innerHTML = '';
      videoTitleEl.classList.add('loading');

      var spinner = document.createElement('span');
      spinner.className = 'spinner';

      var text = document.createElement('span');
      text.textContent = 'ناونیشان دەهێنرێت...';

      videoTitleEl.appendChild(spinner);
      videoTitleEl.appendChild(text);
    }

    function setTitleText(title) {
      videoTitleEl.classList.remove('loading');
      setText(videoTitleEl, title);
    }

    function fetchTitle(id) {
      if (titleCache[id]) {
        setTitleText(titleCache[id]);
        return;
      }

      setTitleLoading();

      if (fetchController) {
        fetchController.abort();
      }
      fetchController = new AbortController();

      fetch('https://noembed.com/embed?url=https://www.youtube.com/watch?v=' + id, {
        signal: fetchController.signal
      })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (id !== currentId) return;
          if (data && data.title) {
            titleCache[id] = data.title;
            setTitleText(data.title);
          } else {
            setTitleText('ناونیشان بەردەست نییە');
          }
        })
        .catch(function(err) {
          if (err.name === 'AbortError') return;
          if (id !== currentId) return;
          setTitleText('ناونیشان بەردەست نییە');
        });
    }

    function buildIframeCode(id) {
      return '<iframe width="560" height="315" ' +
             'src="https://www.youtube.com/embed/' + id + '" ' +
             'title="YouTube video player" frameborder="0" ' +
             'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" ' +
             'referrerpolicy="strict-origin-when-cross-origin" ' +
             'allowfullscreen></iframe>';
    }

    function update() {
      var val = input.value;
      clearBtn.classList.toggle('visible', val.length > 0);

      var id = extractVideoId(val);

      if (!id) {
        currentId = null;
        result.classList.remove('show');
        error.classList.toggle('show', val.trim().length > 0);
        if (fetchController) {
          fetchController.abort();
          fetchController = null;
        }
        return;
      }

      if (id === currentId) return;
      currentId = id;

      error.classList.remove('show');
      result.classList.add('show');

      setText(videoIdEl, id);
      setText(embedEl, 'https://www.youtube.com/embed/' + id);
      setText(iframeCodeEl, buildIframeCode(id));

      var maxUrl = 'https://img.youtube.com/vi/' + id + '/maxresdefault.jpg';
      setText(thumbEl, maxUrl);

      thumbImg.onerror = function () {
        this.onerror = null;
        var hq = 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg';
        this.src = hq;
        setText(thumbEl, hq);
      };

      thumbImg.onload = function () {
        if (this.naturalWidth <= 120) {
          var hq = 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg';
          this.onerror = null;
          this.src = hq;
          setText(thumbEl, hq);
        }
      };

      thumbImg.src = maxUrl;

      // وەرگرتنی ناونیشان
      fetchTitle(id);
    }

    input.addEventListener('input', update);

    pasteBtn.addEventListener('click', function() {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function(text) {
          if (text) {
            input.value = text.trim();
            currentId = null;
            update();
            input.focus();
          }
        }).catch(function() {
          input.focus();
          showToast('⚠️ ڕێگە بە خوێندنەوەی Clipboard نادرێت');
        });
      } else {
        input.focus();
        showToast('⚠️ وێبگەڕەکەت پشتگیری ناکات');
      }
    });

    clearBtn.addEventListener('click', function() {
      input.value = '';
      currentId = null;
      update();
      input.focus();
    });

    var copyBtns = document.querySelectorAll('.copy-btn');
    for (var i = 0; i < copyBtns.length; i++) {
      (function(btn) {
        btn.addEventListener('click', function() {
          var target = document.getElementById(btn.getAttribute('data-target'));
          var text = target.textContent;
          if (!text || target.classList.contains('loading')) return;

          copyToClipboard(text).then(function(success) {
            if (success) {
              var span = btn.querySelector('span');
              var original = span.textContent;
              btn.classList.add('copied');
              span.textContent = 'کۆپی کرا ✓';
              showToast('بە سەرکەوتوویی کۆپی کرا');
              setTimeout(function() {
                btn.classList.remove('copied');
                span.textContent = original;
              }, 1500);
            } else {
              showToast('⚠️ هەڵە لە کۆپیکردن');
            }
          });
        });
      })(copyBtns[i]);
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).then(function() {
          return true;
        }).catch(function() {
          return fallbackCopy(text);
        });
      }
      return Promise.resolve(fallbackCopy(text));
    }

    function fallbackCopy(text) {
      try {
        var textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.top = '-9999px';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(textarea);
        return ok;
      } catch (e) {
        return false;
      }
    }

    var toastTimer;
    function showToast(msg) {
      toastText.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() {
        toast.classList.remove('show');
      }, 2000);
    }

    window.addEventListener('load', function() {
      input.focus();
    });
  })();
</script>
</body>
</html>
